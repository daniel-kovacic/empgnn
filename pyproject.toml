[project]
name = "empgnn"
version = "0.1.0"
description = "Equivariant message passing with node identifiers (EGIN / ENGNN) for substructure counting"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.4",
    "torch-geometric>=2.5",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["empgnn"]
